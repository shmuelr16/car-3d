<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AVIR GT-S</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#07080c; --panel:rgba(16,18,26,.72); --line:rgba(255,255,255,.10);
    --txt:#eef1f7; --dim:#98a0b4;
    --a1:#ff2d6f; --a2:#7b5cff; --a3:#00d4ff;
  }
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"SF Hebrew","Segoe UI",Rubik,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #c.drag{cursor:grabbing}

  /* ---------- loader ---------- */
  #loader{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;
    background:radial-gradient(60% 60% at 50% 45%,#141826 0%,#07080c 70%);z-index:50;transition:opacity .5s}
  #loader.gone{opacity:0;pointer-events:none}
  .logo{font:800 34px/1 Arial;letter-spacing:.22em;
    background:linear-gradient(90deg,var(--a1),var(--a2) 45%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .bar{width:220px;height:4px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
  .bar i{display:block;height:100%;width:35%;border-radius:99px;
    background:linear-gradient(90deg,var(--a1),var(--a3));animation:sl 1.1s ease-in-out infinite}
  @keyframes sl{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
  #loader small{color:var(--dim);font-size:13px;letter-spacing:.02em}

  /* ---------- HUD ---------- */
  #title{position:fixed;top:18px;inset-inline-start:20px;z-index:20;pointer-events:none}
  #title b{display:block;font:800 20px/1.15 Arial;letter-spacing:.16em;
    background:linear-gradient(90deg,#fff,#9fb2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #title span{font-size:11.5px;color:var(--dim);letter-spacing:.1em}
  #hint{position:fixed;bottom:14px;inset-inline-start:20px;z-index:20;color:var(--dim);font-size:12px;
    pointer-events:none;transition:opacity .6s}
  #hint.off{opacity:0}
  #stats{position:fixed;bottom:14px;inset-inline-end:20px;z-index:20;color:#5c6478;font-size:11px;
    font-variant-numeric:tabular-nums;pointer-events:none}

  /* ---------- panel ---------- */
  #ui{position:fixed;z-index:30;top:50%;inset-inline-end:16px;transform:translateY(-50%);
    width:268px;max-height:calc(100vh - 40px);overflow-y:auto;overscroll-behavior:contain;
    background:var(--panel);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
    border:1px solid var(--line);border-radius:20px;padding:16px 15px;
    box-shadow:0 24px 60px rgba(0,0,0,.55);transition:transform .35s cubic-bezier(.2,.9,.3,1),opacity .3s}
  #ui::-webkit-scrollbar{width:6px}#ui::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
  #ui.hidden{transform:translateY(-50%) translateX(calc(-100% - 32px));opacity:0;pointer-events:none}
  .grp{margin-bottom:15px}
  .grp>h4{font-size:10.5px;letter-spacing:.16em;color:var(--dim);margin:0 2px 8px;font-weight:700}
  .row{display:flex;flex-wrap:wrap;gap:7px}
  .sw{width:34px;height:34px;border-radius:11px;border:2px solid rgba(255,255,255,.14);cursor:pointer;
    position:relative;transition:transform .18s,border-color .18s}
  .sw:hover{transform:translateY(-2px) scale(1.06)}
  .sw.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.14)}
  .btn{flex:1 1 auto;min-width:66px;padding:8px 10px;border-radius:12px;cursor:pointer;font-size:12.5px;font-weight:600;
    background:rgba(255,255,255,.055);border:1px solid var(--line);color:var(--txt);
    display:flex;align-items:center;justify-content:center;gap:6px;transition:.18s;user-select:none}
  .btn:hover{background:rgba(255,255,255,.11);transform:translateY(-1px)}
  .btn.on{background:linear-gradient(135deg,var(--a2),var(--a1));border-color:transparent;
    box-shadow:0 8px 22px rgba(123,92,255,.35)}
  .btn svg{width:15px;height:15px;flex:none}
  .sl{display:flex;align-items:center;gap:9px;margin-top:8px}
  .sl label{font-size:11.5px;color:var(--dim);min-width:52px}
  input[type=range]{-webkit-appearance:none;flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.14);outline:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:linear-gradient(135deg,var(--a3),var(--a2));box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer}
  #fold{position:fixed;z-index:31;top:18px;inset-inline-end:16px;width:38px;height:38px;border-radius:12px;
    display:grid;place-content:center;cursor:pointer;background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:var(--txt)}
  #fold:hover{background:rgba(255,255,255,.12)}
  #err{position:fixed;inset:0;z-index:99;display:none;place-content:center;text-align:center;padding:30px;
    background:#07080c;color:#ff8ba7;font-size:14px;line-height:1.7}

  @media (max-width:860px){
    #ui{top:auto;bottom:0;inset-inline:0;width:100%;transform:none;max-height:44vh;
      border-radius:22px 22px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
    #ui.hidden{transform:translateY(110%)}
    #hint,#stats{display:none}
    .row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
    .row::-webkit-scrollbar{display:none}
    .sw,.btn{flex:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title"><b>AVIR&nbsp;GT‑S</b><span>מודל תלת־ממד · הדמיית סטודיו</span></div>
<div id="hint">גרור לסיבוב · גלגלת לזום · גרירה ימנית להזזה</div>
<div id="stats"></div>

<div id="fold" title="הצג/הסתר תפריט (H)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18">
    <path d="M4 6h16M4 12h16M4 18h16"/></svg>
</div>

<div id="ui"></div>

<div id="loader">
  <div class="logo">AVIR GT</div>
  <div class="bar"><i></i></div>
  <small id="lmsg">בונה גיאומטריה…</small>
</div>
<div id="err"></div>

<script src="vendor/three.min.js"></script>
<script>
if(!window.THREE){document.write('<scr'+'ipt src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"><\/scr'+'ipt>');}
</script>
<script src="car-model.js"></script>
<script>
/* =========================================================================
   AVIR GT-S — procedural 3D car model
   ========================================================================= */
(function(){
'use strict';
var E=document.getElementById('err');
function fatal(m){E.style.display='grid';E.innerHTML=m;var l=document.getElementById('loader');if(l)l.className='gone';}
if(!window.THREE){fatal('לא הצלחתי לטעון את three.js.<br>ודא שהקובץ <b>vendor/three.min.js</b> נמצא ליד הקובץ, או שיש חיבור לאינטרנט.');return;}
window.addEventListener('error',function(ev){fatal('שגיאה: '+(ev.message||'')+'<br><small>'+(ev.filename||'')+':'+(ev.lineno||'')+'</small>');});

/* the model itself lives in car-model.js, shared with the driving sim */
var A=window.AVIR;
if(!A){fatal('חסר הקובץ <b>car-model.js</b> ליד הדף.');return;}
var T=THREE, PI=Math.PI, clamp=T.MathUtils.clamp, lerp=T.MathUtils.lerp;
var CAR=A.CAR, LIGHTS=A.LIGHTS, MAT=A.MAT, makeMaterials=A.makeMaterials;
var cvs=A.util.cvs, tex=A.util.tex, blobTexture=A.util.blobTexture, mesh=A.util.mesh;

/* ================= SCENE ================= */
var canvas=document.getElementById('c');
var renderer=new T.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight,false);
if('outputColorSpace' in renderer&&T.SRGBColorSpace)renderer.outputColorSpace=T.SRGBColorSpace;
else renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;

var scene=new T.Scene();
var backdrop=(function(){
  var c=cvs(512,512),x=c.getContext('2d');
  var g=x.createRadialGradient(256,300,20,256,300,330);
  g.addColorStop(0,'#2b3547');g.addColorStop(0.45,'#161d29');
  g.addColorStop(1,'#070910');
  x.fillStyle=g;x.fillRect(0,0,512,512);
  return tex(c,1,1,true);
})();
scene.background=backdrop;
scene.fog=new T.Fog(0x0b0e16,20,52);
var camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,0.08,220);

var studioEnv=A.studioEnv;
var pmrem=new T.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
var envRT=pmrem.fromScene(studioEnv(),0.035);
var ENV=envRT.texture;
scene.environment=ENV;

makeMaterials(ENV);

/* ---- lights ---- */
var key=new T.DirectionalLight(0xffffff,2.10);
key.position.set(4.6,7.2,5.0);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near=1;key.shadow.camera.far=26;
key.shadow.camera.left=-4.2;key.shadow.camera.right=4.2;
key.shadow.camera.top=4.2;key.shadow.camera.bottom=-4.2;
key.shadow.bias=-0.0006;key.shadow.normalBias=0.022;
key.shadow.radius=2.2;
scene.add(key);scene.add(key.target);
var fill=new T.DirectionalLight(0x9fbaff,0.62);fill.position.set(-6.2,3.4,3.4);scene.add(fill);
var fill2=new T.DirectionalLight(0xffd9b4,0.34);fill2.position.set(6.4,2.4,-3.2);scene.add(fill2);
var rim=new T.DirectionalLight(0xbfd4ff,1.45);rim.position.set(-1.5,3.2,-7.5);scene.add(rim);
scene.add(new T.HemisphereLight(0x9fb2d4,0x141821,0.30));
/* soft bounce inside the cabin - without it the interior is a black hole behind the tint */
var cabinLight=new T.PointLight(0xc8d8f4,2.6,3.4,2.0);
cabinLight.position.set(0,1.10,-0.30);scene.add(cabinLight);
var cabinLight2=new T.PointLight(0xb9cbe8,1.05,2.6,2.0);
cabinLight2.position.set(0,0.98,0.42);scene.add(cabinLight2);

/* ---- ground ---- */
var floorT=(function(){
  var c=cvs(512,512),x=c.getContext('2d');
  var g=x.createRadialGradient(256,256,10,256,256,256);
  g.addColorStop(0,'#3a4356');g.addColorStop(0.35,'#222834');
  g.addColorStop(0.72,'#11141c');g.addColorStop(1,'#070910');
  x.fillStyle=g;x.fillRect(0,0,512,512);
  return tex(c,1,1,true);
})();
var groundMat=new T.MeshStandardMaterial({map:floorT,color:0xffffff,roughness:0.26,metalness:0.55,
  envMap:ENV,envMapIntensity:0.30});
var ground=new T.Mesh(new T.CircleGeometry(46,96),groundMat);
ground.rotation.x=-PI/2;ground.receiveShadow=true;scene.add(ground);
var gridT=(function(){
  var c=cvs(512,512),x=c.getContext('2d');
  x.fillStyle='rgba(0,0,0,0)';x.fillRect(0,0,512,512);
  x.strokeStyle='rgba(150,180,255,.055)';x.lineWidth=2;
  for(var i=0;i<=8;i++){var p=i*64;x.beginPath();x.moveTo(p,0);x.lineTo(p,512);x.stroke();
    x.beginPath();x.moveTo(0,p);x.lineTo(512,p);x.stroke();}
  return tex(c,10,10,false);
})();
var grid=new T.Mesh(new T.CircleGeometry(24,80),
  new T.MeshBasicMaterial({map:gridT,transparent:true,opacity:0.55,depthWrite:false}));
grid.rotation.x=-PI/2;grid.position.y=0.002;scene.add(grid);
/* soft contact shadow */
var contact=new T.Mesh(new T.PlaneGeometry(5.6,2.9),
  new T.MeshBasicMaterial({map:tex(blobTexture(0.72,0.40),1,1,false),transparent:true,
    opacity:0.85,depthWrite:false,blending:T.NormalBlending}));
contact.rotation.x=-PI/2;contact.position.y=0.004;scene.add(contact);

/* ================= ASSEMBLE THE CAR ================= */
var car=new T.Group(),wheels=[],steerables=[],doors=null,IT=null;
function buildCar(){
  var b=A.build();
  car=b.car;wheels=b.wheels;steerables=b.steerables;doors=b.doors;IT=b.interior||null;
  addDriver();
  scene.add(car);
  window.__CAR.car=car;window.__CAR.doors=doors;window.__CAR.DRV=DRV;
}

/* ================= THE DRIVER =================
   The same figure the sim drives, sat at the wheel by the same IK.
   Here he only has to sit still, so one pose at build time is enough. */
var DRV=null;
var DRVP=new T.Vector3(0.335,0.575,-0.260),DSC=0.94,_dv=new T.Vector3();
function toDriver(x,y,z){return _dv.set(x,y,z).sub(DRVP).divideScalar(DSC);}
function addDriver(){
  DRV=A.person({detail:'high',lean:-0.22,shades:false,
    jacket:new T.MeshStandardMaterial({color:0x2b3240,roughness:0.87,metalness:0,
      envMap:ENV,envMapIntensity:0.24}),
    trouser:new T.MeshStandardMaterial({color:0x2a2f3a,roughness:0.92,metalness:0,
      envMap:ENV,envMapIntensity:0.16})});
  DRV.g.position.copy(DRVP);DRV.g.scale.setScalar(DSC);
  car.add(DRV.g);
  A.poseChain(DRV.legR.up,DRV.legR.fore,DRV.legR.hand,DRV.hipR,
    toDriver(0.255,0.470,0.420),new T.Vector3(-0.28,1,0.15).normalize());
  A.poseChain(DRV.legL.up,DRV.legL.fore,DRV.legL.hand,DRV.hipL,
    toDriver(0.430,0.430,0.360),new T.Vector3(0.28,1,0.15).normalize());
  poseHands();
}
function poseHands(){
  if(!DRV||!IT||!IT.wheel)return;
  IT.wheel.updateMatrix();
  A.poseChain(DRV.armL.up,DRV.armL.fore,DRV.armL.hand,DRV.shL,
    _dv.set(0.150,0,-0.048).applyMatrix4(IT.wheel.matrix).sub(DRVP).divideScalar(DSC),
    new T.Vector3(0.45,-1,-0.35).normalize());
  A.poseChain(DRV.armR.up,DRV.armR.fore,DRV.armR.hand,DRV.shR,
    _dv.set(-0.150,0,-0.048).applyMatrix4(IT.wheel.matrix).sub(DRVP).divideScalar(DSC),
    new T.Vector3(-0.45,-1,-0.35).normalize());
}

/* ================= CAMERA CONTROL ================= */
var ctl={th:-0.62,ph:1.16,rad:8.4,tgt:new T.Vector3(0,0.66,0),
  tth:-0.62,tph:1.16,trad:8.4,ttgt:new T.Vector3(0,0.66,0),auto:true,idle:0,fit:1,yoff:0};
var _look=new T.Vector3();
function fitFrame(){
  var a=innerWidth/innerHeight;
  ctl.fit=a<1?clamp(1.15/a,1,1.95):(a<1.35?1.12:1);
  ctl.yoff=a<1?1.60:0;
}
fitFrame();
function applyCam(){
  ctl.th+=(ctl.tth-ctl.th)*0.12;ctl.ph+=(ctl.tph-ctl.ph)*0.12;
  ctl.rad+=(ctl.trad-ctl.rad)*0.12;ctl.tgt.lerp(ctl.ttgt,0.12);
  ctl.ph=clamp(ctl.ph,0.12,PI/2+0.24);
  var R=ctl.rad*(ctl.rad<3?1:ctl.fit),sp=Math.sin(ctl.ph);
  camera.position.set(ctl.tgt.x+R*sp*Math.sin(ctl.th),
    ctl.tgt.y+R*Math.cos(ctl.ph),ctl.tgt.z+R*sp*Math.cos(ctl.th));
  _look.copy(ctl.tgt);_look.y-=ctl.rad<3?0:ctl.yoff;
  camera.lookAt(_look);
}
(function(){
  var down=false,btn=0,lx=0,ly=0,pinch=0,hint=document.getElementById('hint');
  function pos(e){return e.touches?e.touches[0]:e;}
  canvas.addEventListener('pointerdown',function(e){
    down=true;btn=e.button;lx=e.clientX;ly=e.clientY;ctl.auto=false;ctl.idle=0;
    canvas.classList.add('drag');canvas.setPointerCapture(e.pointerId);
    if(hint)hint.className='off';
  });
  canvas.addEventListener('pointermove',function(e){
    if(!down)return;
    var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;ctl.idle=0;
    if(btn===2||e.shiftKey){
      var r=new T.Vector3().subVectors(camera.position,ctl.ttgt).normalize();
      var right=new T.Vector3().crossVectors(new T.Vector3(0,1,0),r).normalize();
      var up=new T.Vector3().crossVectors(r,right).normalize();
      var k=ctl.rad*0.0013;
      ctl.ttgt.addScaledVector(right,dx*k).addScaledVector(up,-dy*k);
      ctl.ttgt.y=clamp(ctl.ttgt.y,-0.3,3.2);
    }else{
      ctl.tth-=dx*0.0062;ctl.tph-=dy*0.0055;
      ctl.tph=clamp(ctl.tph,0.12,PI/2+0.24);
    }
  });
  function up(e){down=false;canvas.classList.remove('drag');}
  canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
  canvas.addEventListener('wheel',function(e){
    e.preventDefault();ctl.auto=false;ctl.idle=0;
    ctl.trad=clamp(ctl.trad*(1+Math.sign(e.deltaY)*0.09),2.3,24);
  },{passive:false});
  canvas.addEventListener('touchstart',function(e){
    if(e.touches.length===2){
      pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    }
  },{passive:true});
  canvas.addEventListener('touchmove',function(e){
    if(e.touches.length===2&&pinch){
      var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      ctl.trad=clamp(ctl.trad*(pinch/d),2.3,24);pinch=d;ctl.auto=false;
    }
  },{passive:true});
})();

/* ================= UI ================= */
var state={lights:false,brake:false,roll:false,steer:false,auto:true,grid:true,interior:false,
  door:false,driver:true};
var PAINTS=[
  ['#a3121f','אדום מרוץ',0x8f0f1c],['#0d1c3d','כחול לילה',0x0b1733],
  ['#c9ccd2','כסף נוזלי',0xb9bfc8],['#111317','שחור פחם',0x0c0e12],
  ['#d9560b','כתום להבה',0xc44a06],['#0f5a44','ירוק בריטי',0x0b4a37],
  ['#e8e2d4','לבן פנינה',0xdcd6c8],['#6d1fbf','סגול חלל',0x5a1aa6]
];
var RIMS=[['#2b2e34','גרפיט',0x2a2d33,0.22],['#c3c9d4','כסף',0xb8bfcb,0.16],
  ['#8a6a2f','ברונזה',0x7d5f28,0.24],['#0b0c0e','שחור מבריק',0x090a0c,0.10]];
function ic(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
var ICON={
  bulb:ic('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10.5V16H8v-2.5A6 6 0 0 1 12 3z"/>'),
  brake:ic('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/>'),
  rot:ic('<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/>'),
  wheel:ic('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/>'),
  cam:ic('<path d="M3 8h4l2-2h6l2 2h4v12H3z"/><circle cx="12" cy="14" r="3.5"/>'),
  grid:ic('<path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>'),
  shot:ic('<path d="M12 5v10M8 11l4 4 4-4M4 19h16"/>'),
  door:ic('<path d="M4 20V6l10-2v18z"/><circle cx="11.5" cy="12" r="1"/><path d="M14 20h6V9l-6-4"/>'),
  man:ic('<circle cx="12" cy="5.4" r="2.6"/><path d="M12 8v7M8 11l4-2 4 2M9.5 21l2.5-6 2.5 6"/>')
};
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstChild;}
function group(t,inner){return '<div class="grp"><h4>'+t+'</h4><div class="row">'+inner+'</div></div>';}
(function buildUI(){
  var h='';
  h+=group('צבע מרכב',PAINTS.map(function(p,i){
    return '<div class="sw'+(i===0?' on':'')+'" data-paint="'+i+'" title="'+p[1]+'" style="background:'+p[0]+'"></div>';
  }).join(''));
  h+=group('גימור חישוקים',RIMS.map(function(p,i){
    return '<div class="sw'+(i===0?' on':'')+'" data-rim="'+i+'" title="'+p[1]+'" style="background:'+p[0]+'"></div>';
  }).join(''));
  h+=group('תאורה ותנועה',
    '<div class="btn" data-t="lights">'+ICON.bulb+'אורות</div>'+
    '<div class="btn" data-t="brake">'+ICON.brake+'בלמים</div>'+
    '<div class="btn on" data-t="auto">'+ICON.rot+'סיבוב</div>'+
    '<div class="btn" data-t="roll">'+ICON.wheel+'גלגלים</div>'+
    '<div class="btn" data-t="door">'+ICON.door+'דלת</div>'+
    '<div class="btn on" data-t="driver">'+ICON.man+'נהג</div>');
  h+=group('מצלמה',
    ['3/4','צד','חזית','אחור','מלמעלה','פנים'].map(function(n,i){
      return '<div class="btn'+(i===0?' on':'')+'" data-cam="'+i+'">'+(i===0?ICON.cam:'')+n+'</div>';
    }).join(''));
  h+=group('תצוגה',
    '<div class="btn on" data-t="grid">'+ICON.grid+'רשת</div>'+
    '<div class="btn" data-a="shot">'+ICON.shot+'צילום</div>');
  h+=group('סימולטור',
    '<a class="btn" href="drive.html" style="text-decoration:none;flex:1;justify-content:center">'+
    'לצאת לנסיעה במסלול ←</a>');
  h+='<div class="sl"><label>מיקוד</label><input type="range" id="fov" min="22" max="62" value="38"></div>';
  h+='<div class="sl"><label>חשיפה</label><input type="range" id="exp" min="60" max="170" value="106"></div>';
  document.getElementById('ui').innerHTML=h;
})();

var CAMS=[[-0.72,1.20,8.2,0,0.66,0],[-PI/2,1.44,7.9,0,0.62,0],[0.06,1.34,7.5,0,0.60,0.2],
  [PI-0.08,1.30,7.7,0,0.62,-0.2],[-0.55,0.32,9.0,0,0.35,0],[3.284,1.311,1.10,0.15,0.82,0.50]];
function setCam(i){
  var c=CAMS[i];ctl.tth=c[0];ctl.tph=c[1];ctl.trad=c[2];ctl.ttgt.set(c[3],c[4],c[5]);
  ctl.auto=false;state.auto=false;ctl.idle=0;
  var ab=document.querySelector('[data-t="auto"]');if(ab)ab.classList.remove('on');
  document.querySelectorAll('[data-cam]').forEach(function(x){
    x.classList.toggle('on',+x.dataset.cam===i);});
}
function applyLights(){
  LIGHTS.head.forEach(function(m){m.material=state.lights?MAT.ledOn:MAT.ledOff;});
  LIGHTS.drl.forEach(function(m){m.material=state.lights?MAT.ledOn:MAT.ledOff;});
  LIGHTS.rev.forEach(function(m){m.material=state.lights?MAT.ledOn:MAT.ledOff;});
  LIGHTS.tail.forEach(function(m){m.material=(state.lights||state.brake)?MAT.tailOn:MAT.tailOff;});
  LIGHTS.brake.forEach(function(m){m.material=state.brake?MAT.tailOn:MAT.tailOff;});
  LIGHTS.beams.forEach(function(b){b.visible=state.lights;});
  LIGHTS.spots.forEach(function(s){s.intensity=state.lights?4.6:0;});
}
document.getElementById('ui').addEventListener('click',function(e){
  var t=e.target.closest('[data-paint],[data-rim],[data-t],[data-cam],[data-a]');
  if(!t)return;
  if(t.dataset.paint!==undefined){
    var p=PAINTS[+t.dataset.paint];MAT.paint.color.setHex(p[2]);MAT.crease.color.setHex(p[2]);
    document.querySelectorAll('[data-paint]').forEach(function(x){x.classList.remove('on');});
    t.classList.add('on');
  }
  if(t.dataset.rim!==undefined){
    var r=RIMS[+t.dataset.rim];MAT.rim.color.setHex(r[2]);MAT.rim.roughness=r[3];
    document.querySelectorAll('[data-rim]').forEach(function(x){x.classList.remove('on');});
    t.classList.add('on');
  }
  if(t.dataset.cam!==undefined)setCam(+t.dataset.cam);
  if(t.dataset.t){
    var k=t.dataset.t;state[k]=!state[k];t.classList.toggle('on',state[k]);
    if(k==='lights'||k==='brake')applyLights();
    if(k==='grid'){grid.visible=state.grid;ground.visible=true;}
    if(k==='auto')ctl.auto=state.auto;
    if(k==='roll')state.steer=state.roll;
    if(k==='driver'&&DRV)DRV.g.visible=state.driver;
  }
  if(t.dataset.a==='shot'){
    renderer.render(scene,camera);
    var a=document.createElement('a');
    a.download='avir-gt-s.png';a.href=canvas.toDataURL('image/png');a.click();
  }
});
document.getElementById('fov').addEventListener('input',function(e){
  camera.fov=+e.target.value;camera.updateProjectionMatrix();
});
document.getElementById('exp').addEventListener('input',function(e){
  renderer.toneMappingExposure=+e.target.value/100;
});
document.getElementById('fold').addEventListener('click',function(){
  document.getElementById('ui').classList.toggle('hidden');
});
addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(k==='h')document.getElementById('ui').classList.toggle('hidden');
  if(k==='l'){state.lights=!state.lights;applyLights();
    document.querySelector('[data-t="lights"]').classList.toggle('on',state.lights);}
  if(k>='1'&&k<='6')setCam(+k-1);
});
addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false);
  fitFrame();
});

/* ================= LOOP ================= */
var clock=new T.Clock(),tAcc=0,fps=0,fpsT=0,frames=0,doorA=0;
var statsEl=document.getElementById('stats');
function tick(){
  requestAnimationFrame(tick);
  var dt=Math.min(clock.getDelta(),0.05);tAcc+=dt;
  if(state.roll){
    var v=13.5;
    for(var i=0;i<wheels.length;i++)wheels[i].spin.rotation.x-=dt*v/wheels[i].r;
  }
  if(state.steer){
    var a=Math.sin(tAcc*0.5)*0.26;
    for(var j=0;j<steerables.length;j++)steerables[j].rotation.y=a;
    if(IT&&IT.wheel){IT.wheel.rotation.z=-a*5.6;poseHands();}
  }else{
    for(var j2=0;j2<steerables.length;j2++)steerables[j2].rotation.y*=0.9;
  }
  if(doors){                       /* the driver's door swings on the same hinge as in the sim */
    doorA+=((state.door?1:0)-doorA)*Math.min(1,dt*4.2);
    doors.L.rotation.y=-doorA*A.DOOR.open;
  }
  ctl.idle+=dt;
  if(state.auto&&ctl.idle>7)ctl.auto=true;
  if(ctl.auto)ctl.tth+=dt*0.15;
  applyCam();
  renderer.render(scene,camera);
  frames++;fpsT+=dt;
  if(fpsT>0.5){fps=Math.round(frames/fpsT);frames=0;fpsT=0;
    if(statsEl)statsEl.textContent=fps+' FPS · '+
      (renderer.info.render.triangles/1000).toFixed(0)+'k משולשים';}
}

/* debug/automation hook */
window.__CAR={ctl:ctl,scene:scene,camera:camera,renderer:renderer,MAT:MAT,LIGHTS:LIGHTS,
  state:state,applyLights:applyLights,car:car,setCam:setCam,doors:doors,DRV:DRV,
  CAR:CAR,ghVf:A.surf.ghVf,ghSurf:A.surf.ghSurf,bodySurf:A.surf.bodySurf,
  vOuter:A.surf.vOuter,frameAt:A.surf.frameAt,uAt:A.surf.uAt};

/* ================= BOOT ================= */
function boot(){
  var msg=document.getElementById('lmsg');
  try{
    buildCar();
  }catch(err){
    fatal('שגיאה בבניית המודל:<br><b>'+err.message+'</b><br><small>'+(err.stack||'').split('\n')[1]+'</small>');
    throw err;
  }
  applyLights();
  window.__CAR.car=car;          /* buildCar() rebinds it, so refresh the hook */
  car.updateMatrixWorld(true);
  document.getElementById('loader').className='gone';
  setTimeout(function(){var h=document.getElementById('hint');if(h)h.className='off';},7000);
  tick();
}
requestAnimationFrame(function(){setTimeout(boot,20);});
})();
</script>
